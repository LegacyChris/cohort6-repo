# Azure DevOps Pipeline for .NET App
trigger:
  branches:
    include:
    - '*'
  paths:
    include:
    - legacyapp/**

pr:
  branches:
    include:
    - main

variables:
  buildConfiguration: 'Release'
  dotnetSdkVersion: '9.0.x'
  workingDirectory: 'legacyapp'
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: 'Build Stage'
  jobs:
  - job: Build
    displayName: 'Build Job'
    pool:
      vmImage: $(vmImageName)
    
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET SDK'
      inputs:
        version: $(dotnetSdkVersion)
        includePreviewVersions: false
    
    - task: DotNetCoreCLI@2
      displayName: 'Restore dependencies'
      inputs:
        command: 'restore'
        projects: '$(workingDirectory)/**/*.csproj'
    
    - task: DotNetCoreCLI@2
      displayName: 'Build application'
      inputs:
        command: 'build'
        projects: '$(workingDirectory)/**/*.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'
    
    - task: DotNetCoreCLI@2
      displayName: 'Run tests'
      inputs:
        command: 'test'
        projects: '$(workingDirectory)/**/*Tests.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build --verbosity normal'
      continueOnError: true
    
    - task: DotNetCoreCLI@2
      displayName: 'Publish application'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '$(workingDirectory)/**/*.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/publish --no-build'
        zipAfterPublish: true
    
    - task: PublishBuildArtifacts@1
      displayName: 'Publish artifacts'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/publish'
        ArtifactName: 'drop'
        publishLocation: 'Container'

- stage: DeployDev
  displayName: 'Deploy to Development'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
  jobs:
  - job: DeployDev
    displayName: 'Deploy to Dev Environment'
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: DownloadBuildArtifacts@1
      displayName: 'Download artifacts'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'
    
    - task: AzureWebApp@1
      displayName: 'Deploy to Azure App Service (Dev)'
      inputs:
        azureSubscription: 'Azure-ServiceConnection-Dev'
        appType: 'webAppLinux'
        appName: '$(DevWebAppName)'
        package: '$(System.ArtifactsDirectory)/drop/*.zip'
        runtimeStack: 'DOTNETCORE|9.0'

- stage: DeployUAT
  displayName: 'Deploy to UAT'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: DeployUAT
    displayName: 'Deploy to UAT Environment'
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: DownloadBuildArtifacts@1
      displayName: 'Download artifacts'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'
    
    - task: AzureWebApp@1
      displayName: 'Deploy to Azure App Service (UAT)'
      inputs:
        azureSubscription: 'Azure-ServiceConnection-UAT'
        appType: 'webAppLinux'
        appName: '$(UATWebAppName)'
        package: '$(System.ArtifactsDirectory)/drop/*.zip'
        runtimeStack: 'DOTNETCORE|9.0'

- stage: DeployProd
  displayName: 'Deploy to Production'
  dependsOn: DeployUAT
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: DeployProd
    displayName: 'Deploy to Production Environment'
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: DownloadBuildArtifacts@1
      displayName: 'Download artifacts'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'
    
    - task: AzureWebApp@1
      displayName: 'Deploy to Azure App Service (Production)'
      inputs:
        azureSubscription: 'Azure-ServiceConnection-Prod'
        appType: 'webAppLinux'
        appName: '$(ProdWebAppName)'
        package: '$(System.ArtifactsDirectory)/drop/*.zip'
        runtimeStack: 'DOTNETCORE|9.0'
